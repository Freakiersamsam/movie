<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinemdle</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="year" id="year"></div>

    <div class="container">
        <div class="quotes" id="quotes"></div>
        <div class="actors" id="actors"></div>
        <div class="title" id="title"></div>

        <div class="controls">
            <input type="text" id="guess" placeholder="guess" autocomplete="off">
            <button id="next">next</button>
            <button id="stats">stats</button>
        </div>

        <div class="message" id="message"></div>
        <div class="countdown" id="countdown"></div>
    </div>

    <div class="modal" id="modal">
        <div class="modal-content">
            <div class="close" id="close">×</div>
            <h2>stats</h2>
            <div class="stats">
                <div><span id="played">0</span> played</div>
                <div><span id="won">0</span> won</div>
                <div><span id="streak">0</span> streak</div>
            </div>
            <div class="dist" id="dist"></div>
            <button id="share">share</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
