<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cinemdle</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="year-title" id="year-title"></div>

    <div class="container">
        <div class="round-info" id="round-info"></div>

        <div class="quotes" id="quotes"></div>

        <div class="message" id="message"></div>

        <div class="controls">
            <div class="autocomplete-wrapper">
                <input
                    type="text"
                    id="guess"
                    placeholder="guess the movie..."
                    autocomplete="off"
                >
                <div id="autocomplete-list" class="autocomplete-items"></div>
            </div>
            <button id="next">next hint</button>
        </div>

        <div class="countdown" id="countdown"></div>

        <button id="stats" style="margin-top: 20px; width: 100%;">stats</button>
        <button id="dev-reset" style="margin-top: 10px; width: 100%; opacity: 0.3;">reset (dev)</button>
    </div>

    <div class="modal" id="modal">
        <div class="modal-content">
            <span class="close" id="close">&times;</span>
            <h2>stats</h2>
            <div class="stats">
                <div>played: <span id="played">0</span></div>
                <div>won: <span id="won">0</span></div>
                <div>streak: <span id="streak">0</span></div>
            </div>
            <h2>guess distribution</h2>
            <div class="dist" id="dist"></div>
            <button id="share">share</button>
        </div>
    </div>

    <script src="movies.js"></script>
    <script src="script.js"></script>
</body>
</html>
